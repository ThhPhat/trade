<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: common_head('Đăng Bán / Sửa Sách - Kênh Người Bán')}"></head>

<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">

    <header th:replace="~{fragments/common/navbar :: common_navbar('vendor')}"></header>

    <main class="w-full pt-28 pb-16 flex-1 max-w-4xl mx-auto px-4">
        <div class="bg-surface-container-lowest p-8 rounded-3xl border border-surface-container shadow-sm">
            <div class="flex items-center justify-between mb-8 pb-4 border-b border-surface-container">
                <div>
                    <h1 class="text-xl font-bold text-on-surface" th:text="${sanPham.maSP != null ? 'Chỉnh Sửa Sách' : 'Đăng Bán Sách Mới'}">Đăng Bán Sách</h1>
                    <p class="text-xs text-on-surface-variant mt-1">Thông tin sách của gian hàng: <strong th:text="${shop.tenShop}"></strong></p>
                </div>
                <a th:href="@{/vendor/products}" class="px-4 py-2 bg-surface-container text-on-surface text-xs font-bold rounded-xl hover:bg-surface-container-high transition-all">Quay lại danh sách</a>
            </div>

            <form th:action="@{/vendor/products/save}" method="post" class="space-y-6">
                <input type="hidden" name="maSP" th:value="${sanPham.maSP}"/>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Tên Sách / Sản Phẩm <span class="text-error">*</span></label>
                        <input type="text" name="tenSP" th:value="${sanPham.tenSP}" required
                               class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Mã ISBN</label>
                        <input type="text" name="ISBN" th:value="${sanPham.ISBN}"
                               class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"/>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Giá Bán (VNĐ) <span class="text-error">*</span></label>
                        <input type="number" name="giaBan" th:value="${sanPham.giaBan}" required min="1000" step="1000"
                               class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary font-bold text-primary"/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Số Lượng Trong Kho <span class="text-error">*</span></label>
                        <input type="number" name="soLuongTon" th:value="${sanPham.soLuongTon != null ? sanPham.soLuongTon : 10}" required min="0"
                               class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Trạng Thái Bán</label>
                        <select name="trangThai" class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary">
                            <option value="DangBan" th:selected="${sanPham.trangThai == 'DangBan'}">Đang bán</option>
                            <option value="HetHang" th:selected="${sanPham.trangThai == 'HetHang'}">Tạm hết hàng</option>
                            <option value="NgungBan" th:selected="${sanPham.trangThai == 'NgungBan'}">Ngừng kinh doanh</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Danh Mục Sách</label>
                        <select name="maDanhMuc" class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary">
                            <option th:each="dm : ${danhMucs}" th:value="${dm.maDanhMuc}" th:text="${dm.tenDanhMuc}"
                                    th:selected="${sanPham.danhMuc != null and sanPham.danhMuc.maDanhMuc == dm.maDanhMuc}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Nhà Xuất Bản</label>
                        <select name="maNXB" class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary">
                            <option th:each="nxb : ${nhaXuatBans}" th:value="${nxb.maNXB}" th:text="${nxb.tenNXB}"
                                    th:selected="${sanPham.nhaXuatBan != null and sanPham.nhaXuatBan.maNXB == nxb.maNXB}"></option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Link Ảnh Bìa Sách (URL)</label>
                    <input type="url" name="hinhAnh" th:value="${sanPham.hinhAnh}" placeholder="https://..."
                           class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"/>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Mô Tả Nội Dung Sách</label>
                    <textarea name="moTa" rows="5" th:text="${sanPham.moTa}"
                              class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"
                              placeholder="Tóm tắt giới thiệu cuốn sách..."></textarea>
                </div>

                <div class="pt-4 border-t border-surface-container flex items-center justify-end gap-3">
                    <a th:href="@{/vendor/products}" class="px-5 py-2.5 rounded-xl bg-surface-container text-xs font-bold hover:bg-surface-container-high transition-all">Hủy</a>
                    <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary text-xs font-bold hover:bg-primary-container shadow-sm transition-all">Lưu Sách</button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/common/footer :: common_footer}"></footer>
</body>
</html>
