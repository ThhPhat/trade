<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: common_head('Hồ Sơ & Cài Đặt Gian Hàng - Kênh Người Bán')}"></head>

<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">

    <header th:replace="~{fragments/common/navbar :: common_navbar('vendor')}"></header>

    <main class="w-full pt-28 pb-16 flex-1 max-w-4xl mx-auto px-4">
        <div class="bg-surface-container-lowest p-8 rounded-3xl border border-surface-container shadow-sm">
            <div class="flex items-center justify-between mb-8 pb-4 border-b border-surface-container">
                <div>
                    <h1 class="text-xl font-bold text-on-surface">Cài Đặt Gian Hàng &amp; Trang Trí Shop</h1>
                    <p class="text-xs text-on-surface-variant mt-1">Tùy biến tên, logo, banner để thu hút người mua</p>
                </div>
                <a th:href="@{'/shop/' + ${shop.slug}}" target="_blank" class="px-4 py-2 bg-primary/10 text-primary text-xs font-bold rounded-xl hover:bg-primary hover:text-white transition-all flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-sm">visibility</span>
                    <span>Xem Trang Chủ Shop</span>
                </a>
            </div>

            <!-- Alerts -->
            <div th:if="${successMessage}" class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-semibold flex items-center gap-2">
                <span class="material-symbols-outlined">check_circle</span>
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-semibold flex items-center gap-2">
                <span class="material-symbols-outlined">error</span>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/vendor/profile}" method="post" class="space-y-6">
                <!-- Banner Preview -->
                <div>
                    <label class="block text-xs font-bold uppercase text-on-surface-variant mb-2">Ảnh Bìa / Banner Gian Hàng (URL)</label>
                    <div class="h-44 w-full rounded-2xl overflow-hidden bg-surface-container-low border border-surface-container mb-3 relative">
                        <img th:src="${shop.banner != null ? shop.banner : 'https://images.unsplash.com/photo-1507842229451-7f01be45c06b?w=1200'}"
                             alt="Banner Shop" class="w-full h-full object-cover"/>
                    </div>
                    <input type="url" name="banner" th:value="${shop.banner}" placeholder="https://..."
                           class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"/>
                </div>

                <!-- Logo & Shop Name -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Ảnh Đại Diện / Logo (URL)</label>
                        <div class="flex items-center gap-4 mb-2">
                            <img th:src="${shop.logo != null ? shop.logo : '/images/default-shop.png'}" class="w-14 h-14 rounded-2xl object-cover ring-2 ring-primary/20"/>
                            <input type="url" name="logo" th:value="${shop.logo}" placeholder="https://..."
                                   class="flex-1 px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"/>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Tên Gian Hàng <span class="text-error">*</span></label>
                        <input type="text" name="tenShop" th:value="${shop.tenShop}" required
                               class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs font-bold focus:ring-2 focus:ring-primary"/>
                    </div>
                </div>

                <!-- Contact & Address -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Số Điện Thoại Shop <span class="text-error">*</span></label>
                        <input type="tel" name="soDienThoai" th:value="${shop.soDienThoai}" required
                               class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Email Gian Hàng <span class="text-error">*</span></label>
                        <input type="email" name="emailShop" th:value="${shop.emailShop}" required
                               class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"/>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Địa Chỉ Gian Hàng / Kho <span class="text-error">*</span></label>
                    <input type="text" name="diaChiShop" th:value="${shop.diaChiShop}" required
                           class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"/>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Mô Tả / Giới Thiệu Gian Hàng</label>
                    <textarea name="moTa" rows="4" th:text="${shop.moTa}"
                              class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"></textarea>
                </div>

                <div class="pt-4 border-t border-surface-container flex items-center justify-end gap-3">
                    <a th:href="@{/vendor/dashboard}" class="px-5 py-2.5 rounded-xl bg-surface-container text-xs font-bold hover:bg-surface-container-high transition-all">Quay lại</a>
                    <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary text-xs font-bold hover:bg-primary-container shadow-sm transition-all">Lưu Thay Đổi</button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/common/footer :: common_footer}"></footer>
</body>
</html>
